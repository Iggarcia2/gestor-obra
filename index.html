<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Obra V0.4</title>
<link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Gestor de Obra</h1>
      <small>V0.4 · multiobra</small>
    </div>
    <nav class="nav">
      <button data-page="dashboard" class="active">▦ Dashboard</button>
      <button data-page="config">⚙ Configuración</button>
      <button data-page="tasks">✓ Tareas</button>
      <button data-page="purchases">⏳ Compras</button>
      <button data-page="calculators">▤ Rendimientos</button>
      <button data-page="comments">☰ Comentarios</button>
      <button data-page="help">? Ayuda / Archivo</button>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="project-title">
        <strong id="topProjectName">Gestor de Obra</strong>
        <span id="saveState">Inicializando…</span>
      </div>
      <div class="top-actions">
        <select id="projectSelect" class="project-select" title="Cambiar de obra"><option>Cargando obras…</option></select>
        <span id="storageMode" class="storage-mode"></span>
        <button class="btn" id="legendBtn" title="Ver leyenda">? Leyenda</button>
        <select id="activeUser" class="user-select" title="Usuario que registra comentarios">
          <option>Juan</option><option>Vos</option>
        </select>
        <button class="btn" id="newBtn">Nueva obra</button>
        <button class="btn" id="openBtn">Abrir JSON</button>
        <button class="btn primary" id="saveBtn">Guardar</button>
        <button class="btn" id="backupBtn">Guardar copia</button>
        <input type="file" id="fileFallback" accept=".json,application/json" class="hidden">
        <input type="file" id="templateFallback" accept=".json,application/json" class="hidden">
      </div>
    </header>

    <div class="content">
      <section id="page-dashboard" class="page active"></section>
      <section id="page-config" class="page"></section>
      <section id="page-tasks" class="page"></section>
      <section id="page-purchases" class="page"></section>
      <section id="page-calculators" class="page"></section>
      <section id="page-comments" class="page"></section>
      <section id="page-help" class="page"></section>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Tarea</h3><button class="btn" id="modalClose">Cerrar</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase compat: se carga por CDN, pero el adaptador queda deshabilitado hasta completar firebase-config.js. -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<!-- Scripts clásicos y secuenciales: sin bundler ni módulos ES. -->
<script src="./js/core.js"></script>
<script src="./js/calculos/rendimientos.js"></script>
<script src="./js/io/firebase-config.js"></script>
<script src="./js/io/firebase.js"></script>
<script src="./js/io/repositorio.js"></script>
<script src="./js/ui/dashboard.js"></script>
<script src="./js/ui/configuracion.js"></script>
<script src="./js/ui/tareas.js"></script>
<script src="./js/ui/compras.js"></script>
<script src="./js/ui/rendimientos.js"></script>
<script src="./js/ui/comentarios.js"></script>
<script src="./js/ui/ayuda.js"></script>
<script src="./js/ui/modales.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
