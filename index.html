<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Obra V0.3</title>
<style>
:root{
  --bg:#f5f7f6; --panel:#ffffff; --text:#1f2933; --muted:#667085; --line:#d8dee4;
  --accent:#315c48; --accent2:#477762; --accent-soft:#e8f1ec;
  --editable:#e7f4ea; --editable-border:#9fc6aa;
  --intrinsic:#f0f2f4; --intrinsic-border:#d5d9dd;
  --computed:#e7f2f9; --computed-border:#a9c9df;
  --danger:#b42318; --danger-bg:#feeceb;
  --warning:#a15c00; --warning-bg:#fff3d6;
  --ok:#1e6c43; --ok-bg:#e8f5ec;
  --blue:#175cd3; --blue-bg:#eaf2ff;
  --shadow:0 3px 14px rgba(16,24,40,.08);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}
.sidebar{background:#20372d;color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:8px 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand h1{font-size:18px;margin:0 0 4px}.brand small{color:#c7d6cf}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{border:0;background:transparent;color:#dce8e2;text-align:left;border-radius:9px;padding:10px 11px}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}
.sidebar .legend{font-size:12px;color:#d6e2dc;margin-top:22px;padding:10px;border:1px solid rgba(255,255,255,.14);border-radius:10px}
.legend-line{display:flex;gap:7px;align-items:center;margin:7px 0}
.swatch{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 18px}
.project-title{min-width:0}.project-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-title span{font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:8px 10px}
.btn:hover{background:#f8faf9}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:var(--danger);border-color:#f0b9b4}
.user-select{border:1px solid var(--editable-border);background:var(--editable);border-radius:9px;padding:8px}
.content{padding:20px;max-width:1500px;margin:0 auto}
.page{display:none}.page.active{display:block}
.page-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.page-head h2{margin:0 0 5px;font-size:24px}.page-head p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:15px}.kpi .num{font-size:27px;font-weight:750;margin-top:5px}.kpi .label{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.progress-wrap{height:25px;background:#edf0ee;border-radius:99px;overflow:hidden;border:1px solid #dce3df}
.progress-bar{height:100%;background:linear-gradient(90deg,#315c48,#66a181);width:0%;transition:width .25s}
.progress-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.progress-title strong{font-size:28px}
.mini-list{display:flex;flex-direction:column;gap:8px}
.mini-item{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.mini-item .meta{font-size:11px;color:var(--muted);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:650;border:1px solid transparent;white-space:nowrap}
.badge.pending{background:#f2f4f7;color:#475467}.badge.ready{background:var(--ok-bg);color:var(--ok)}
.badge.progress{background:var(--blue-bg);color:var(--blue)}.badge.blocked{background:var(--danger-bg);color:var(--danger)}
.badge.review{background:var(--warning-bg);color:var(--warning)}.badge.done{background:#dff3e7;color:#17643d}
.badge.na{background:#f2f4f7;color:#667085}.badge.purchase{background:#f4ebff;color:#6941c6}
.quick-status{border:1px solid var(--editable-border);background:var(--editable);border-radius:8px;padding:6px 28px 6px 8px;font-size:12px;font-weight:650;min-width:150px}
.quick-status.status-blocked{background:var(--danger-bg);border-color:#efb5af;color:var(--danger)}
.quick-status.status-review{background:var(--warning-bg);border-color:#efd38c;color:var(--warning)}
.quick-status.status-done{background:var(--ok-bg);border-color:#a8d5b8;color:var(--ok)}
.quick-status.status-ready{background:#e8f5ec;border-color:#a8d5b8;color:var(--ok)}
.quick-status.status-progress{background:var(--blue-bg);border-color:#b6cdf5;color:var(--blue)}
.quick-status.status-na{background:#f2f4f7;border-color:#d0d5dd;color:#667085}
.section-title{font-size:15px;font-weight:700;margin:0 0 10px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid #e7eaed;padding:9px 10px;text-align:left;vertical-align:middle}
th{background:#f7f9f8;position:sticky;top:0;z-index:2;color:#475467;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
tr.clickable:hover td{background:#fafcfb}
.cell-intrinsic{background:var(--intrinsic)}
.cell-editable{background:var(--editable)}
.cell-computed{background:var(--computed)}
.filters{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr 1fr;gap:8px;margin:0 0 12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:650;color:#475467}
.field input,.field select,.field textarea{border:1px solid var(--editable-border);background:var(--editable);border-radius:8px;padding:8px 9px;min-width:0}
.field textarea{min-height:82px;resize:vertical}
.field.readonly input,.field.readonly select,.field.readonly textarea,.readonly-box{border:1px solid var(--intrinsic-border);background:var(--intrinsic);color:#475467}
.readonly-box{padding:8px 9px;border-radius:8px;min-height:36px}
.computed-box{border:1px solid var(--computed-border);background:var(--computed);padding:8px 9px;border-radius:8px;min-height:36px}
.config-group{margin-bottom:14px}
.config-group summary{font-weight:750;padding:13px 15px;cursor:pointer}
.config-fields{padding:0 15px 15px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.config-note{font-size:11px;color:var(--muted);margin-top:3px}
.package-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.package-weight{padding:10px;border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:1fr 78px;gap:8px;align-items:center}
.package-weight input{width:100%;border:1px solid var(--editable-border);background:var(--editable);border-radius:7px;padding:7px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:10px 0;color:var(--muted);font-size:12px}
.pagination button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px}
.alert{padding:11px 13px;border-radius:10px;border:1px solid}.alert.info{background:var(--computed);border-color:var(--computed-border)}
.alert.warn{background:var(--warning-bg);border-color:#efd38c}.alert.danger{background:var(--danger-bg);border-color:#efb5af}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;z-index:50;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.open{display:flex}
.modal{width:min(980px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.24)}
.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.modal-head h3{margin:0;font-size:18px}.modal-body{padding:16px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.span2{grid-column:span 2}.span3{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.comment-stream{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.comment{background:#f8faf9;border:1px solid var(--line);border-radius:9px;padding:9px}.comment .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.calc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.calc-card{padding:15px}.calc-row{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:7px;align-items:center;margin:7px 0}
.calc-row input{width:100%;border:1px solid var(--editable-border);background:var(--editable);border-radius:7px;padding:7px}
.calc-result{background:var(--computed);border:1px solid var(--computed-border);padding:10px;border-radius:9px;margin-top:9px}
.rule-box{border-left:4px solid var(--warning);background:#fff7df;padding:12px 13px;border-radius:8px;margin-bottom:14px}
.footer-note{font-size:12px;color:var(--muted);margin-top:12px}
.toast{position:fixed;right:18px;bottom:18px;background:#1f2933;color:#fff;border-radius:10px;padding:11px 14px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:100}
.toast.show{opacity:1;transform:translateY(0)}
.hidden{display:none!important}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.calc-grid{grid-template-columns:1fr}.config-fields,.package-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
 .app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.sidebar .legend{display:none}
 .topbar{position:relative;align-items:flex-start}.top-actions{justify-content:flex-start}.content{padding:12px}
 .kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.config-fields,.package-grid,.form-grid{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
}
</style>
</head>

    <div class="content">

      <section id="page-config" class="page"></section>

      <section id="page-purchases" class="page"></section>
      <section id="page-calculators" class="page"></section>
      <section id="page-comments" class="page"></section>
      <section id="page-help" class="page"></section>

  </main>
</div>

    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

function taskReady(t){
  if(!isApplicable(t)) return {ok:false,reason:"No aplica"};
  if(t.status==="Bloqueada 🔴") return {ok:false,reason:t.blockReason||"Marcada como bloqueada"};
  if(t.status==="Espera control ⚠️") return {ok:false,reason:"Espera control"};
  if(t.requiresReview==="Sí" && t.reviewed!=="Sí" && ["Lista 🟢","En curso","Terminada ✅"].includes(t.status))
    return {ok:false,reason:"Falta visto / control"};
  if(t.blockReason) return {ok:false,reason:t.blockReason};
  if(["Lista 🟢","En curso","Terminada ✅"].includes(t.status)) return {ok:true,reason:"Lista"};
  return {ok:false,reason:"Aún pendiente"};
}
function packageStats(){
  return project.packages.map(p=>{
    const ts=project.tasks.filter(t=>t.package===p.name && isApplicable(t));
    const done=ts.filter(t=>t.status==="Terminada ✅").length;
    const progress=ts.length?done/ts.length*100:0;
    return {...p,count:ts.length,done,progress,contribution:progress*num(p.weight)/100};
  });
}
function overallProgress(){ return packageStats().reduce((a,p)=>a+p.contribution,0); }
function taskComments(taskId){ return project.comments.filter(c=>c.taskId===taskId).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }

  if(!p.neededDate) return "";

}
function purchaseAlert(p){
  if(["Recibido","Cancelado"].includes(p.status)||p.arrived==="Sí") return {label:"Cerrada",cls:"done"};
  const start=purchaseStartDate(p); if(!start) return {label:"Sin fecha",cls:"pending"};
  const d=daysBetween(todayISO(),start);
  if(d<0)return{label:`Vencida ${Math.abs(d)} d`,cls:"blocked"};
  if(d<=14)return{label:`Acción en ${d} d`,cls:"review"};
  if(d<=30)return{label:`Próxima ${d} d`,cls:"purchase"};
  return{label:`En ${d} d`,cls:"pending"};
}

function updateTaskStatusQuick(id,value){

function calcCard(title,rows,result){return`<div class="card calc-card"><h3 class="section-title">${title}</h3>${rows.map(r=>`<div class="calc-row"><span>${r[0]}</span><input type="number" step="any" value="${esc(r[4]??"")}" onchange="updateCalc('${r[2]}','${r[3]}',this.value)"><small>${r[1]}</small></div>`).join("")}<div class="calc-result">${result}</div></div>`}
function updateCalc(group,key,value){project.calculators[group][key]=value===""?null:num(value);markDirty();renderCalculators();}
function updateCoeff(i,key,value){project.coefficients[i][key]=value===""?null:num(value);markDirty();}

function renderComments(){
 const el=$("#page-comments"),comments=[...project.comments].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 el.innerHTML=`
 <div class="page-head"><div><h2>Comentarios / historial</h2><p>Fecha, autor, tarea y paquete quedan asociados para poder analizarlos después.</p></div><button class="btn" onclick="exportCommentsCSV()">Exportar CSV</button></div>
 <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Autor</th><th>ID tarea</th><th>Paquete</th><th>Comentario</th></tr></thead><tbody>
 ${comments.map(c=>`<tr><td>${new Date(c.date).toLocaleString("es-AR")}</td><td>${esc(c.author)}</td><td><button class="btn" style="padding:3px 6px" onclick="openTask('${c.taskId}')">${esc(c.taskId)}</button></td><td>${esc(c.package)}</td><td>${esc(c.text)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Todavía no hay comentarios.</td></tr>'}</tbody></table></div>`;
}

 $("#page-help").innerHTML=`
 <div class="page-head"><div><h2>Ayuda / almacenamiento</h2><p>Esta V0.3 es un único HTML, sin servidor, sin Firebase y sin fotos.</p></div></div>
 <div class="grid2">
  <div class="card pad"><h3 class="section-title">Cómo guarda</h3>
   <p>La app conserva una copia automática en <b>localStorage</b> del navegador para evitar pérdidas accidentales.</p>
   <p><b>Guardar:</b> en Chrome/Edge y un sitio seguro (por ejemplo GitHub Pages), la primera vez pide elegir un archivo JSON. Mientras la pestaña siga abierta, los siguientes guardados actualizan ese mismo archivo.</p>
   <p>Si el navegador no permite escritura directa, “Guardar” descarga un JSON. “Guardar copia” siempre descarga un backup.</p>
   <div class="alert info">El JSON es la “base de datos” provisoria. Más adelante esta capa se puede reemplazar por Google Drive o Firebase sin rehacer la lógica de tareas.</div>

    <li>Calculadoras de materiales con descuento de aberturas.</li>

 </div>
 <div class="card pad" style="margin-top:14px"><h3 class="section-title">Regla de uso</h3>
  <p>La herramienta gestiona y anticipa; no reemplaza planos, cálculos, ensayos ni aprobaciones del profesional responsable.</p>
 </div>`;

function openModal(){$("#modalBackdrop").classList.add("open")}
function closeModal(){$("#modalBackdrop").classList.remove("open")}

function openLegend(){
  $("#modalTitle").textContent="Leyenda";
  $("#modalBody").innerHTML=`
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:10px;align-items:flex-start"><span class="swatch" style="background:var(--editable);width:18px;height:18px"></span><div><strong>Editable</strong><div class="footer-note">Datos que Juan o vos pueden modificar: estado, responsable, fechas, cantidades, configuración, etc.</div></div></div>
      <div style="display:flex;gap:10px;align-items:flex-start"><span class="swatch" style="background:var(--intrinsic);width:18px;height:18px"></span><div><strong>Intrínseco de plantilla</strong><div class="footer-note">Información propia de la tarea o del modelo base.</div></div></div>
      <div style="display:flex;gap:10px;align-items:flex-start"><span class="swatch" style="background:var(--computed);width:18px;height:18px"></span><div><strong>Automático / calculado</strong><div class="footer-note">Valores derivados por el sistema, como progreso o fecha recomendada de compra.</div></div></div>
    </div>`;

$("#legendBtn").addEventListener("click",openLegend);

$("#modalClose").onclick=closeModal;$("#modalBackdrop").addEventListener("click",e=>{if(e.target===$("#modalBackdrop"))closeModal()});

$$(".nav button").forEach(b=>b.addEventListener("click",()=>{
 $$(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 $$(".page").forEach(p=>p.classList.remove("active"));currentPage=b.dataset.page;$("#page-"+currentPage).classList.add("active");
}));

$("#activeUser").addEventListener("change",e=>{project.project.activeUser=e.target.value;markDirty();});
$("#newBtn").addEventListener("click",()=>{
 if(!confirm("Crear un proyecto nuevo desde la plantilla V0.1. La copia actual sigue disponible si la guardaste/exportaste. ¿Continuar?"))return;
 const name=prompt("Nombre del nuevo proyecto:","Nueva obra")||"Nueva obra";
 project=freshTemplate(); const c=project.config.find(x=>x.field==="Nombre de obra");if(c)c.value=name;project.project.name=name;currentFileHandle=null;
 localStorage.setItem(STORAGE_KEY,JSON.stringify(project));dirty=true;renderAll();toast("Proyecto nuevo creado");
});
$("#openBtn").addEventListener("click",openProjectFile);
$("#saveBtn").addEventListener("click",saveProject);
$("#backupBtn").addEventListener("click",downloadProject);
$("#fileFallback").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f)return;try{loadProjectJson(await f.text());currentFileHandle=null;toast("JSON importado");}catch(err){alert("No se pudo abrir el JSON: "+err.message)} e.target.value="";
});

async function openProjectFile(){
 if("showOpenFilePicker" in window && window.isSecureContext){
   try{
    const [h]=await window.showOpenFilePicker({types:[{description:"Proyecto Gestor de Obra",accept:{"application/json":[".json"]}}],multiple:false});
    const f=await h.getFile();loadProjectJson(await f.text());currentFileHandle=h;toast("Proyecto abierto con permiso de escritura");return;
   }catch(e){if(e.name==="AbortError")return;}
 }
 $("#fileFallback").click();
}
function loadProjectJson(text){
 const p=JSON.parse(text); if(!p.tasks||!p.project)throw new Error("El archivo no parece un proyecto válido.");
 project=p;ensureProjectShape();localStorage.setItem(STORAGE_KEY,JSON.stringify(project));dirty=false;renderAll();markSaved("Proyecto abierto");
}
async function saveProject(){
 project.project.updatedAt=nowISO(); localStorage.setItem(STORAGE_KEY,JSON.stringify(project));
 const contents=JSON.stringify(project,null,2);
 try{
   if(currentFileHandle){
     const w=await currentFileHandle.createWritable();await w.write(contents);await w.close();markSaved("JSON actualizado");toast("Guardado en el mismo JSON");return;
   }
   if("showSaveFilePicker" in window && window.isSecureContext){
     currentFileHandle=await window.showSaveFilePicker({suggestedName:(slug(project.project.name)||"proyecto")+".json",types:[{description:"Proyecto Gestor de Obra",accept:{"application/json":[".json"]}}]});
     const w=await currentFileHandle.createWritable();await w.write(contents);await w.close();markSaved("JSON creado");toast("JSON creado. Los próximos guardados actualizan este archivo.");return;
   }
 }catch(e){if(e.name==="AbortError")return;console.warn(e);}
 downloadProject();markSaved("Backup descargado");toast("El navegador no permite escritura directa: se descargó el JSON");
}
function downloadProject(){
 const blob=new Blob([JSON.stringify(project,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(slug(project.project.name)||"proyecto")+"_"+todayISO()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function exportCommentsCSV(){
 const rows=[["Fecha","Autor","ID tarea","Paquete","Comentario"],...project.comments.map(c=>[c.date,c.author,c.taskId,c.package,c.text])];
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(slug(project.project.name)||"proyecto")+"_comentarios.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});

loadInitial();
</script>
